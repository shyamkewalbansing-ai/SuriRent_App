    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "black-translucent": de statusbalk wordt doorzichtig, de app-content
         vloeit eronder door. Hierdoor toont de Kiosk zijn oranje achtergrond

         blijft de witte header doorlopen — iOS rendert de klok wel wit,
         maar admin-gebruikers gebruiken vooral de in-app navigatie. -->

    <title>SuriRent - Vastgoed Kiosk</title>
    <script>
      // First-paint background: voorkomt witte flash op iOS PWA standalone bij
      // start van /login (Kiosk PIN, Beheerder login/register) of /kiosk. React
      // overschrijft dit nadien via body.login-mode / body.kiosk-mode klassen.
      (function () {
        try {
          var p = (window.location.pathname || '').toLowerCase();
          if (p === '/login' || p.indexOf('/login') === 0 || p === '/kiosk' || p.indexOf('/kiosk') === 0 || p === '/') {
            document.documentElement.style.backgroundColor = '#FF5C00';
          }
        } catch (e) { /* no-op */ }
      })();
    </script>

  <body style="background-color: #FFF7F0;">
    <noscript>JavaScript is vereist om deze app te gebruiken.</noscript>
    <div id="root"></div>
