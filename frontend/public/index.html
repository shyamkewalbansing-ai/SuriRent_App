<!DOCTYPE html>
<html lang="nl">

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#FFF7F0" />
    <!-- (specifieke variant zodat Android Chrome PWA dezelfde status-bar
         kleur gebruikt als de iPhone PWA standalone — brand cream voor de
         admin, oranje wordt dynamisch gezet door KioskLayout). -->
    <meta name="description" content="SuriRent - Complete huurbeheer & kiosk oplossing voor vastgoed" />
    <meta name="application-name" content="SuriRent" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/kiosk-icons/kiosk-favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/kiosk-icons/kiosk-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/kiosk-icons/kiosk-512.png" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "black-translucent": de statusbalk wordt doorzichtig, de app-content
         vloeit eronder door. Hierdoor toont de Kiosk zijn oranje achtergrond
         achter de iPhone-klok/batterij (matcht de huisstijl). In de Admin
         blijft de witte header doorlopen — iOS rendert de klok wel wit,
         maar admin-gebruikers gebruiken vooral de in-app navigatie. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SuriRent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/kiosk-icons/kiosk-192.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/kiosk-icons/kiosk-144.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/kiosk-icons/kiosk-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/kiosk-icons/kiosk-512.png" />

    <link rel="apple-touch-startup-image" href="/kiosk-icons/splash/iphone-13-portrait.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/kiosk-icons/splash/iphone-13-landscape.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="/kiosk-icons/splash/iphone-xs-max-portrait.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/kiosk-icons/splash/iphone-xs-max-landscape.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" />

    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileColor" content="#FF5C00" />
    <meta name="msapplication-TileImage" content="/kiosk-icons/kiosk-144.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>SuriRent - Vastgoed Kiosk</title>
    <script>
      // First-paint background: voorkomt witte flits + witte strook onderaan
      // op iOS PWA standalone bij start van /login, /kiosk, of /. We zetten
      // zowel <html> als <body> op brand-oranje zodat ook het home-indicator
      // gebied (onder safe-area) en de status-bar gebied gevuld zijn met de
      // brand-kleur, niet wit. React overschrijft dit nadien via body.login-mode
      // / body.kiosk-mode klassen.
      (function () {
        try {
          var p = (window.location.pathname || '').toLowerCase();
          var isBrand = p === '/login' || p.indexOf('/login') === 0
            || p === '/kiosk' || p.indexOf('/kiosk') === 0 || p === '/';
          if (!isBrand) return;
          var BG = '#FF5C00';
          document.documentElement.style.backgroundColor = BG;
          var applyBody = function () {
            if (document.body) document.body.style.backgroundColor = BG;
          };
          if (document.body) applyBody();
          else document.addEventListener('DOMContentLoaded', applyBody);
        } catch (e) { /* no-op */ }
      })();
    </script>

    <!-- ===========================================================
         Inline PWA-rol detectie — DRAAIT VÓÓR React mount
         ===========================================================
         iOS Safari leest `apple-mobile-web-app-title` en `apple-touch-icon`
         tijdens "Toevoegen aan beginscherm". Onze React-hook draait pas na
         hydration; iOS kan op dat moment al de oude waarden cachen. Dit
         inline-script zorgt dat de meta-tags al goed staan op het moment
         dat de gebruiker op "Delen → Toevoegen aan beginscherm" tikt. -->
    <script>
      (function () {
        try {
          var ROLES = {
            beheer:  { name: 'SuriRent Beheer',         short: 'Beheer',         theme: '#FF5C00', icon: 'beheer'   },
            kiosk:   { name: 'SuriRent Kiosk',          short: 'Kiosk',          theme: '#2563EB', icon: 'kioskpwa' },
            huurder: { name: 'SuriRent Huurder',        short: 'Huurder',        theme: '#10B981', icon: 'huurder'  },
            klant:   { name: 'SuriRent Klantenscherm',  short: 'Klantenscherm',  theme: '#9333EA', icon: 'klant'    }
          };
          var p = (location.pathname || '').toLowerCase();
          // Branded routes (/c/<slug>/...): strip prefix
          var sub = p;
          if (p.indexOf('/c/') === 0) {
            sub = '/' + p.split('/').slice(3).join('/');
          }
          var role = 'beheer';
          if (sub.indexOf('/admin') === 0) role = 'beheer';
          else if (sub === '/kiosk/klant' || sub.indexOf('/kiosk/klant') === 0) role = 'klant';
          else if (sub === '/kiosk' || sub.indexOf('/kiosk') === 0) role = 'kiosk';
          else if (sub.indexOf('/huurder') === 0) role = 'huurder';

          var cfg = ROLES[role];
          // 1. Manifest
          var m = document.querySelector('link[rel="manifest"]');
          if (m) m.setAttribute('href', '/manifest-' + role + '.json');
          // 2. iOS title
          var t = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (t) t.setAttribute('content', cfg.short);
          var an = document.querySelector('meta[name="application-name"]');
          if (an) an.setAttribute('content', cfg.short);
          // 3. theme-color
          var th = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < th.length; i++) th[i].setAttribute('content', cfg.theme);
          // 4. apple-touch-icon — vervang /kiosk-icons/<naam>-<size>.png met cfg.icon
          var icons = document.querySelectorAll('link[rel="apple-touch-icon"]');
          for (var j = 0; j < icons.length; j++) {
            var h = icons[j].getAttribute('href') || '';
            var match = h.match(/^(\/kiosk-icons\/)([a-z]+)(-\d+\.png)$/i);
            if (match) icons[j].setAttribute('href', match[1] + cfg.icon + match[3]);
          }
          // 5. Page title
          document.title = cfg.name + ' — SuriRent';
        } catch (e) { /* no-op */ }
      })();
    </script>
  </head>
  <body style="background-color: #FFF7F0;">
    <noscript>JavaScript is vereist om deze app te gebruiken.</noscript>
    <div id="root"></div>
  </body>
</html>
