<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    SuriRent merkmark — krachtige geometrische S monogram:
    • Oranje gradient rounded-square (iOS-style 22% radius)
    • Witte "S" in moderne geometrische vorm met afgeronde uiteinden
    • 3 horizontalen + 2 halfronde lussen (echte S-structuur, eindigt linksonder)
    • Perfecte symmetrie en balans op canvas center
  -->
  <defs>
    <linearGradient id="bgGrad" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#FF8A3D" />
      <stop offset="100%" stop-color="#D94500" />
    </linearGradient>
    <linearGradient id="innerShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.18" />
      <stop offset="55%" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="white" stop-opacity="0.08" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
      <feOffset dx="0" dy="4" result="blur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.18" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square achtergrond met diepte -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="url(#centerGlow)" />
  <rect width="512" height="512" rx="112" fill="url(#innerShine)" />

  <!-- S monogram met zachte schaduw -->
  <g filter="url(#softShadow)">
    <path d="
      M 312 96
      L 200 96
      C 144 96, 144 256, 200 256
      L 312 256
      C 368 256, 368 416, 312 416
      L 200 416
    "
    fill="none"
    stroke="white"
    stroke-width="52"
    stroke-linecap="round"
    stroke-linejoin="round" />
  </g>
</svg>
