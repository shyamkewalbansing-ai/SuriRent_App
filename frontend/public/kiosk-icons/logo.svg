<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    SuriRent vastgoed-icoon — schoon wit huis op vlak oranje achtergrond.
    Constructie volgorde (z-stack):
    1. Chimney rechthoek (achter dak — alleen bovendeel zichtbaar)
    2. Dak: gevulde driehoek, peak boven, basis matches eave-extents
    3. Eave: horizontale bar onder dak, breder dan muur (overhang)
    4. Muur met deur-uitsparing (smaller dan eave)
  -->
  <defs>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="-8" dy="10" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.22" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#FF6A1F" />

  <g filter="url(#softShadow)" transform="translate(256 256) scale(1.2) translate(-256 -256)">
    <!-- Chimney: achter dak, eindigt boven roof slope om "leg" te voorkomen -->
    <rect x="156" y="120" width="52" height="120" fill="white" />

    <!-- Dak: gevulde driehoek, basis op zelfde y als eave -->
    <polygon points="256,124 84,306 428,306" fill="white" />

    <!-- Eave: horizontale bar onder dak (overhang t.o.v. muur) -->
    <rect x="84" y="306" width="344" height="20" rx="2" fill="white" />

    <!-- Muur met deur-uitsparing — smaller dan eave -->
    <path fill="white" d="
      M 140 326
      L 372 326
      L 372 466
      L 296 466
      L 296 386
      L 216 386
      L 216 466
      L 140 466
      Z
    " />
  </g>
</svg>
